<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather API Integration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 25px;
            width: 300px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        button {
            padding: 8px 15px;
            background: #ff5722;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Weather App</h2>
    <p id="weather">Click button to load weather</p>
    <button onclick="getWeather()">Get Weather</button>
</div>

<script>
    function getWeather() {
        fetch("https://api.open-meteo.com/v1/forecast?latitude=13.08&longitude=80.27&current_weather=true")
            .then(response => response.json())
            .then(data => {
                document.getElementById("weather").innerHTML =
                    "Temperature: " + data.current_weather.temperature + "°C";
            })
            .catch(error => {
                document.getElementById("weather").innerHTML = "Error loading data";
            });
    }
</script>

</body>
</html>
