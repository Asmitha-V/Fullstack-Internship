<!DOCTYPE html>
<html>
<head>
    <title>Chat Application</title>
    <script src="/socket.io/socket.io.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat {
            background: white;
            padding: 20px;
            width: 300px;
            border-radius: 10px;
        }

        #messages {
            height: 200px;
            overflow-y: auto;
            border: 1px solid #ccc;
            margin-bottom: 10px;
            padding: 5px;
        }

        input {
            width: 70%;
            padding: 5px;
        }

        button {
            width: 25%;
            padding: 5px;
            background: orange;
            border: none;
            color: white;
        }
    </style>
</head>

<body>

<div class="chat">
    <h3>Chat App</h3>
    <div id="messages"></div>
    <input id="msg" placeholder="Type message">
    <button onclick="send()">Send</button>
</div>

<script>
    var socket = io();

    function send() {
        var msg = document.getElementById("msg").value;
        socket.emit('message', msg);
        document.getElementById("msg").value = "";
    }

    socket.on('message', function(msg) {
        var div = document.createElement("div");
        div.innerText = msg;
        document.getElementById("messages").appendChild(div);
    });
</script>

</body>
</html>
